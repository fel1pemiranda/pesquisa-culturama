<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online Culturama</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="name">Nome:</label>
            <input id="name" type="text" name="name" required>
            <br>
            <label for="age">Idade:</label>
            <input id="age" type="number" name="age" min="12" max="100" required>
            <br>
            <label for="date">Data de nascimento:</label>
            <input id="date" type="date" name="date">
            <br>
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" required>
            <br>
            <label for="phoneNumber">Telefone:</label>
            <input id="phoneNumber" type="tel" name="phoneNumber" pattern="[0-9]{11}" placeholder="DDD+número sem espaço ou hífens">
            <br>
            <label for="image">Upload de Foto:</label>
            <input id="image" type="file" accept="image/*" name="image">
            </fieldset> 
                 
            <fieldset>
            <legend>Pefil</legend>

            <p>Gênero:</p>
            <input id="fem" type="radio" name="userGender" value="Feminino">
            <label for="fem">Feminino</label>

            <input id="masc" type="radio" name="userGender" value="Masculino">
            <label for="masc">Masculino</label>

            <input id="notInformed" type="radio" name="userGender" value="notInformed">
            <label for="notInformed">Prefiro não informar</label>      
        <br>
        <label for="maritalStatus">Estado civil:</label>
        <select id="maritalStatus" name="maritalStatus">
            <option value="notInformed">Selecione...</option>
            <option value="Casado">Casado</option>
            <option value="Solteiro">Solteiro</option>
            <option value="Divorciado">Divorciado</option>     
            <option value="União Estável">União Estável</option>
        </select>
        
        <label for="userState">Estado:</label>
        <select id="userState" name="userState">
            <option value="">Selecione seu estado</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option> 
        </select>
            <label for="city">Cidade:</label>
            <input id="city" type="text" name="city" placeholder="Digite sua cidade">
        </fieldset>

        <fieldset>
            <legend>Hábitos</legend>
            <p>Redes Sociais:</p>
            <input id="instagram" type="checkbox" name="social" value="instagram">
            <label for="instagram">Instagram</label>
            <br>
            <input id="facebook" type="checkbox" name="social" value="facebook">
            <label for="facebook">Facebook</label>
            <br>
            <input id="linkedin" type="checkbox" name="social" value="Linkedin">
            <label for="linkedin">Linkedin</label>
            <br>
            <input id="x" type="checkbox" name="social" value="X">
            <label for="x">X</label>

            
        </fieldset>
            <button type="submit">Enviar</button>    
        </form>
     </section>
</body>
</html>
