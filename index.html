<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="culturama-favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap"
        rel="stylesheet"
    >

    <title>Pesquisa Culturama</title>
</head>

<body>
    <main>
        <header>
            <img src="img/logo-culturama.png" alt="Logo da Culturama">
            <h1>Pesquisa de Opinião</h1>
        </header>

        <section>
            <form action="sucesso.html" method="get">
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="name">Nome:</label>
                    <input id="name" type="text" name="name" required>

                    <br>

                    <label for="age">Idade:</label>
                    <input id="age" type="number" name="age" min="12" max="100" required>

                    <br>

                    <label for="date">Data de nascimento:</label>
                    <input id="date" type="date" name="date">

                    <br>

                    <label for="email">E-mail:</label>
                    <input id="email" type="email" name="email" required>

                    <br>

                    <label for="phoneNumber">Telefone:</label>
                    <input
                        id="phoneNumber"
                        type="tel"
                        name="phoneNumber"
                        pattern="[0-9]{11}"
                        placeholder="DDD+número sem espaço ou hífens" aria-describedby="phoneHelp">
                        <small id="phoneHelp">Preencha com 11 dígitos no formato: DDD + número sem espaçoes ou hífen.</small>

                    <br>

                    <label for="image">Upload de foto:</label>
                    <input
                        id="image"
                        type="file"
                        accept="image/*"
                        name="image" aria-describedby="imageHelp">
                        <small id="imageHelp">Envia uma foto no formato PNG ou JPEG</small>

                </fieldset>

                <fieldset>
                    <legend>Perfil</legend>

                    <fieldset>
                        <legend>Gênero:</legend>

                        <input
                            id="fem"
                            type="radio"
                            name="userGender"
                            value="Feminino"
                        >
                        <label for="fem">Feminino</label>

                        <input
                            id="masc"
                            type="radio"
                            name="userGender"
                            value="Masculino"
                        >
                        <label for="masc">Masculino</label>

                        <input
                            id="notInformed"
                            type="radio"
                            name="userGender"
                            value="notInformed"
                        >
                        <label for="notInformed">Prefiro não informar</label>
                    </fieldset>

                    <br>

                    <label for="maritalStatus">Estado civil:</label>
                    <select id="maritalStatus" name="maritalStatus">
                        <option value="notInformed">Selecione...</option>
                        <option value="Casado">Casado</option>
                        <option value="Solteiro">Solteiro</option>
                        <option value="Divorciado">Divorciado</option>
                        <option value="União Estável">União Estável</option>
                    </select>

                    <label for="userState">Estado:</label>
                    <select id="userState" name="userState">
                        <option value="">Selecione seu estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>

                    <label for="city">Cidade:</label>
                    <input
                        id="city"
                        type="text"
                        name="city"
                        placeholder="Digite sua cidade"
                    >
                </fieldset>

                <fieldset>
                    <legend>Hábitos</legend>

                    <p>Redes sociais:</p>

                    <input
                        id="instagram"
                        type="checkbox"
                        name="social"
                        value="instagram"
                    >
                    <label for="instagram">Instagram</label>

                    <br>

                    <input
                        id="facebook"
                        type="checkbox"
                        name="social"
                        value="facebook"
                    >
                    <label for="facebook">Facebook</label>

                    <br>

                    <input
                        id="linkedin"
                        type="checkbox"
                        name="social"
                        value="Linkedin"
                    >
                    <label for="linkedin">LinkedIn</label>

                    <br>

                    <input
                        id="x"
                        type="checkbox"
                        name="social"
                        value="X"
                    >
                    <label for="x">X</label>

                    <br>

                    <label for="musicStyle">Estilo musical:</label>
                    <input
                        list="styleTypes"
                        type="text"
                        id="musicStyle"
                        name="userMusicStyle"
                    >

                    <datalist id="styleTypes">
                        <option value="Rock"></option>
                        <option value="Pop"></option>
                        <option value="Samba"></option>
                        <option value="Sertanejo"></option>
                    </datalist>

                    <br>

                    <label for="favoriteColor">Cor favorita:</label>
                    <input
                        type="color"
                        name="userFavoriteColor"
                        id="favoriteColor"
                    >
                </fieldset>

                <fieldset>
                    <legend>Opinião</legend>

                    <fieldset>
                        <legend>O que você acha da qualidade do nosso serviço?</legend>

                        <input
                            id="otimo"
                            type="radio"
                            name="userServiceOpinion"
                            value="otimo"
                        >
                        <label for="otimo">Ótimo</label>

                        <br>

                        <input
                            id="bom"
                            type="radio"
                            name="userServiceOpinion"
                            value="bom"
                        >
                        <label for="bom">Bom</label>

                        <br>

                        <input
                            id="regular"
                            type="radio"
                            name="userServiceOpinion"
                            value="regular"
                        >
                        <label for="regular">Regular</label>

                        <br>

                        <input
                            id="ruim"
                            type="radio"
                            name="userServiceOpinion"
                            value="ruim"
                        >
                        <label for="ruim">Ruim</label>
                    </fieldset>

                    <br>

                    <label for="comment">Escreva sua opinião:</label>
                    <textarea
                        name="userComment"
                        id="comment"
                        placeholder="Digite aqui..."
                    ></textarea>
                </fieldset>

                <fieldset>
                    <legend>Confirmações</legend>

                    <input
                        type="checkbox"
                        name="userLgpd"
                        id="userLgpdTerm"
                        value="accepted"
                        required
                    >
                    <label for="userLgpdTerm">
                        Eu aceito participar da pesquisa
                    </label>

                    <br>

                    <input
                        type="checkbox"
                        name="userGetResult"
                        id="getResult"
                        value="accepted"
                    >
                    <label for="getResult">
                        Desejo receber o resultado por e-mail
                    </label>
                </fieldset>

                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </form>
        </section>
    </main>
</body>
</html>
